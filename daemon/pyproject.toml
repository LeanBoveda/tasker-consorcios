[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tasker-consorcios-daemon"
version = "0.1.0"
description = "Receptor local de correo y WhatsApp para Tasker Consorcios"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.150,<3",
  "google-auth-oauthlib>=1.2,<2",
  "httpx>=0.27,<1",
]

[project.scripts]
tasker-daemon = "tasker_daemon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
